services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password 
      POSTGRES_DB: purch
    ports:
      - "5432:5432"
    volumes:
      - ./initdb/:/docker-entrypoint-initdb.d/
      # - postgres_data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  purch:
    build: 
      context: .
      dockerfile: docker/purch/Dockerfile
    container_name: service-purch
    secrets:
      - env
    ports:
      - "8080:8080"
    command: "./purch"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    
  purch-webhook:
    build: 
      context: .
      dockerfile: docker/purch-webhook/Dockerfile
    container_name: service-purch-webhook
    secrets:
        - env
    ports:
      - "8081:8081"
    command: "./purch-webhook"
    depends_on:
      purch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    
secrets:
  env:
    file: .env
