version: '3'

tasks:
  #####################
  # Docker commands
  #####################
  build:
    cmds:
      - docker compose build

  down:
    cmds:
      - docker compose down

  # use a space delineated list 
  # of individual services to bring up 
  # if you don't want to bring everything up
  # e.g. task up -- postgres <-- only brings up the postgres container
  up:
    cmds:
      - docker compose -f docker-compose.yml up {{.CLI_ARGS}} -d
